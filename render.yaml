databases:
  - name: reuni2k-db
    databaseName: reuni2k
    plan: free

services:
  - type: web
    name: reuni2k
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: id
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: REUNI_DISK
        value: local
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: reuni2k-db
          property: connectionString
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
